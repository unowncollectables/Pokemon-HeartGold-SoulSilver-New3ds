<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pokémon SoulSilver for New Nintendo 3DS</title>
  <desc id="desc">Silver lettering above a moonlit ocean, with rocky islands on the horizon.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#080f21"/>
      <stop offset=".68" stop-color="#192d4d"/>
      <stop offset="1" stop-color="#345e77"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#b8e2ec" stop-opacity=".53"/>
      <stop offset=".44" stop-color="#68a7c9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#68a7c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x2=".3" y2="1">
      <stop stop-color="#f3fcff"/>
      <stop offset="1" stop-color="#8ebed7"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#284b67"/>
      <stop offset="1" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="silver" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".56" stop-color="#e2edf6"/>
      <stop offset="1" stop-color="#a5bfd6"/>
    </linearGradient>
    <linearGradient id="wash">
      <stop stop-color="#080f21" stop-opacity=".65"/>
      <stop offset="1" stop-color="#080f21" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
    <clipPath id="disc"><circle cx="925" cy="159" r="94"/></clipPath>
  </defs>

