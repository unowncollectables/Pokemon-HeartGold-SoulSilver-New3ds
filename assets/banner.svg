      <text x="116" y="101" fill="#a5deed" font-size="20" font-weight="600" letter-spacing="3.5">POKÉMON</text>
      <text x="63" y="205" fill="url(#silver)" font-size="106" font-weight="750" letter-spacing="-4">SoulSilver</text>
      <text x="69" y="252" fill="#c8ddf0" font-size="26" font-weight="600" letter-spacing="4">NEW NINTENDO 3DS</text>
