<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Pokémon SoulSilver — New 3DS Edition</title>
  <desc id="desc">Hand-drawn banner for the personal-use New 3DS native port. No game art.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1a2f3f"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fb4c7"/>
      <stop offset="35%" stop-color="#e8eef5"/>
      <stop offset="70%" stop-color="#b7c7d6"/>
      <stop offset="100%" stop-color="#7f93a8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec6ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6ec6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6ec6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="360" fill="url(#sky)"/>

  <!-- faint geometric lattice (no sprites) -->
  <g opacity="0.18" stroke="#9fb4c7" stroke-width="1" fill="none">
    <path d="M0 280 L160 120 L320 280 Z"/>
    <path d="M200 300 L360 140 L520 300 Z"/>
    <path d="M760 300 L920 140 L1080 300 Z"/>
    <path d="M960 280 L1120 120 L1280 280 Z"/>
    <circle cx="640" cy="170" r="110"/>
    <circle cx="640" cy="170" r="70"/>
    <circle cx="640" cy="170" r="36"/>
  </g>

  <!-- soft glow behind title -->
  <ellipse cx="640" cy="150" rx="420" ry="70" fill="url(#glow)" filter="url(#soft)"/>

  <!-- dual-screen motif -->
  <g transform="translate(96,118)">
    <rect x="0" y="0" width="132" height="84" rx="8" fill="#0e1726" stroke="url(#silver)" stroke-width="2.5"/>
    <rect x="10" y="10" width="112" height="48" rx="3" fill="#1c2d42"/>
    <rect x="30" y="68" width="72" height="6" rx="3" fill="#3a7bd5" opacity="0.85"/>
    <rect x="24" y="100" width="84" height="64" rx="8" fill="#0e1726" stroke="url(#silver)" stroke-width="2.5"/>
    <rect x="34" y="110" width="64" height="44" rx="3" fill="#1c2d42"/>
  </g>

  <!-- title -->
  <text x="640" y="148" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="54" font-weight="700" fill="url(#silver)" letter-spacing="1.5">
    Pokémon SoulSilver
  </text>
  <text x="640" y="198" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="600" fill="#6ec6ff" letter-spacing="4">
    NEW 3DS EDITION
  </text>
  <text x="640" y="238" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="16" fill="#9fb4c7" letter-spacing="1.2">
    Native · Dual-screen · Personal-use fan port
  </text>

  <!-- bottom accent bar -->
  <rect x="0" y="336" width="1280" height="24" fill="#0a101a"/>
  <rect x="0" y="336" width="1280" height="3" fill="url(#accent)"/>
  <text x="640" y="353" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="11" fill="#7f93a8" letter-spacing="2">
    FAN PROJECT · NOT AFFILIATED WITH NINTENDO / GAME FREAK / THE POKÉMON COMPANY
  </text>
</svg>
